[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcheck"
version = "0.1.0"
description = "Lightweight, extensible prompt testing toolkit"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
  {name = "Faiza"}
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ollama = [
  "requests>=2.28",
]
dev = [
  "pytest>=7.0",
  "requests>=2.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
collect_ignore_glob = ["src/*"]
